<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Juan by Julieta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f2;
    --paper:#f2e8e2;
    --choc:#87614d;
    --dulce:#da955c;
    --dulce-soft:#e8cdb4;
    --muted:#9a7c6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Heebo',system-ui,sans-serif;
    background:var(--cream);
    color:var(--choc);
    display:flex;justify-content:center;
    padding:40px 20px 32px;
    background-image:
      radial-gradient(circle at 50% -10%, rgba(218,149,92,.16), transparent 55%);
  }
  main{width:100%;max-width:400px;text-align:center}
  .logo{width:220px;height:220px;display:block;margin:0 auto;filter:drop-shadow(0 6px 18px rgba(135,97,77,.15))}
  .rule{width:56px;height:2px;background:var(--dulce);margin:26px auto;border-radius:2px;opacity:.7}

  .links{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:var(--choc);
    background:var(--paper);
    border:1.5px solid var(--dulce-soft);
    border-radius:16px;
    padding:15px 18px;
    font-size:1.08rem;font-weight:500;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 0 rgba(135,97,77,.04);
  }
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--dulce);box-shadow:0 6px 18px rgba(135,97,77,.08);outline:none}
  .btn svg{width:26px;height:26px;flex:none}
  .btn .txt{flex:1;text-align:right}
  .btn small{display:block;font-size:.82rem;font-weight:400;color:var(--muted);margin-top:2px}
  .btn .arrow{color:var(--dulce);font-size:1.2rem}
  .btn.main{background:var(--dulce);color:#fff;border-color:var(--dulce)}
  .btn.main small{color:#fff3e8}
  .btn.main .arrow{color:#fff}

  .phone{margin-top:26px;padding:16px;border-radius:16px;background:var(--paper);border:1.5px dashed var(--dulce-soft)}
  .phone .lbl{font-size:1rem;color:var(--muted)}
  .phone a{display:block;margin-top:4px;font-size:2rem;font-weight:600;color:var(--choc);text-decoration:none;direction:ltr;letter-spacing:.03em}
  .flavors{margin-top:30px;font-size:.95rem;color:var(--muted);line-height:1.7}
  .flavors b{color:var(--choc);font-weight:600}
  footer{margin-top:28px;font-size:.78rem;color:var(--muted);opacity:.8}
</style>
</head>
